<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#2b6de5"/>
  <link rel="manifest" href="/static/manifest.webmanifest"/>
  <link rel="stylesheet" href="/static/app.css"/>
  <title>Compass</title>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Compass <span data-i18n="brandSub">工作台</span></div>
    <label class="lang-wrap">
      <span class="lang-label">语言 / Language</span>
      <select id="langSelect" aria-label="language">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="es">Español</option>
      </select>
    </label>
    <button class="nav-btn active" data-view="home" data-i18n="navHome">总览</button>
    <button class="nav-btn" data-view="ingest" data-i18n="navIngest">上传简历</button>
    <button class="nav-btn" data-view="life" data-i18n="navLife">职业探索</button>
    <button class="nav-btn" data-view="pipeline" data-i18n="navPipeline">求职准备</button>
    <button class="nav-btn" data-view="interview" data-i18n="navInterview">模拟面试</button>
    <button class="nav-btn" data-view="bank" data-i18n="navBank">题库</button>
    <button class="nav-btn" data-view="about" data-i18n="navAbout">关于</button>
    <div class="side-foot" data-i18n="sideFoot" data-i18n-html="1"></div>
  </aside>

  <div class="main">
    <section class="view active" id="view-home">
      <div class="hero">
        <h1 data-i18n="heroTitle" data-i18n-html="1">专业求职准备，<em>证据驱动</em>每一步</h1>
        <p data-i18n="heroSub"></p>
        <div class="chips">
          <span class="chip" data-i18n="chipGate"></span>
          <span class="chip" data-i18n="chipFollow"></span>
          <span class="chip" data-i18n="chipRag"></span>
          <span class="chip" data-i18n="chipGraph"></span>
        </div>
      </div>
      <div class="panel">
        <h2 data-i18n="connTitle"></h2>
        <p class="desc" id="connStatus" data-i18n="connConnecting"></p>
        <div class="row">
          <button class="primary" id="btnGoLife" data-i18n="btnLife"></button>
          <button class="primary" id="btnGoPipe" data-i18n="btnPipe"></button>
          <button class="ghost" id="btnGoLive" data-i18n="btnLive"></button>
          <a class="btn ghost" id="btnGraph" href="/timeline" target="_blank" data-i18n="btnGraph"></a>
        </div>
      </div>
    </section>

    <section class="view" id="view-life">
      <div class="panel">
        <h2 data-i18n="lifeTitle">兴趣探索 · 职业规划</h2>
        <p class="desc" data-i18n="lifeDesc"></p>
        <div class="grid-2">
          <div class="field-card">
            <label data-i18n="lifeLabelFile">经历文件</label>
            <input type="file" id="lifeFile" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.docx"/>
            <div class="row" style="margin-top:12px">
              <button class="ghost" id="btnLifeFile" data-i18n="lifeBtnFile">解析文件到文本框</button>
            </div>
          </div>
          <div class="field-card">
            <label data-i18n="lifeLabelPaste">经历描述</label>
            <textarea id="lifeIn" data-i18n-placeholder="lifePh" style="min-height:140px"></textarea>
          </div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="primary" id="btnLifeExplore" data-i18n="lifeBtnExplore">开始探索</button>
          <span class="status" id="lifeStatus"></span>
        </div>
        <div class="life-route" id="lifeRoute" hidden></div>
      </div>

      <div class="panel" id="lifeQuizPanel" hidden>
        <h2 data-i18n="lifeQuizTitle">Holland RIASEC 测评</h2>
        <p class="desc" data-i18n="lifeQuizDesc"></p>
        <div id="lifeQuiz" class="life-quiz"></div>
        <div class="row" style="margin-top:14px">
          <button class="primary" id="btnLifeSubmit" data-i18n="lifeBtnSubmit">提交测评</button>
        </div>
      </div>

      <div class="panel" id="lifeReportPanel" hidden>
        <div class="metrics" id="lifeMetrics">
          <div class="metric"><span class="metric-label" data-i18n="lifeMetricCode">Holland 码</span><strong id="lifeCode">—</strong></div>
          <div class="metric"><span class="metric-label" data-i18n="lifeMetricConf">置信度</span><strong id="lifeConf">—</strong></div>
          <div class="metric"><span class="metric-label" data-i18n="lifeMetricRoute">路径</span><strong id="lifeRouteLabel">—</strong></div>
          <div class="metric"><span class="metric-label" data-i18n="lifeMetricSession">会话</span><strong id="lifeSid" style="font-size:.85rem">—</strong></div>
        </div>
        <div class="life-viz" id="lifeViz"></div>
        <div class="life-dims" id="lifeDims"></div>
        <div class="life-paths" id="lifePaths"></div>
        <article class="prose" id="lifeReport"></article>
        <div class="row life-actions">
          <button class="primary" id="btnLifeHandoff" data-i18n="lifeBtnHandoff">一键进入求职准备</button>
          <button class="ghost" id="btnLifeExport" data-i18n="lifeBtnExport">导出 HTML 报告</button>
        </div>
        <div class="life-chat">
          <h3 data-i18n="lifeRefineTitle">基于结果继续追问</h3>
          <textarea id="lifeRefineIn" data-i18n-placeholder="lifeRefinePh" style="min-height:80px"></textarea>
          <div class="row" style="margin-top:10px">
            <button class="primary" id="btnLifeRefine" data-i18n="lifeBtnRefine">发送</button>
          </div>
          <div id="lifeChat" class="life-chat-log"></div>
        </div>
      </div>
    </section>

    <section class="view" id="view-ingest">
      <div class="panel">
        <h2 data-i18n="ingestTitle"></h2>
        <p class="desc" data-i18n="ingestDesc"></p>
        <div class="grid-2">
          <div class="field-card">
            <label data-i18n="labelFile"></label>
            <input type="file" id="fileIn" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,.docx"/>
            <div class="row" style="margin-top:12px">
              <button class="primary" id="btnUpload" data-i18n="btnUpload"></button>
            </div>
          </div>
          <div class="field-card">
            <label data-i18n="labelPaste"></label>
            <textarea id="pasteIn" data-i18n-placeholder="phPaste"></textarea>
            <div class="row" style="margin-top:12px">
              <button class="primary" id="btnPaste" data-i18n="btnPaste"></button>
            </div>
          </div>
        </div>
        <p class="status" id="ingestStatus"></p>
        <article class="prose" id="ingestPreview" hidden></article>
      </div>
    </section>

    <section class="view" id="view-pipeline">
      <div class="panel pipe-input">
        <h2 data-i18n="pipeTitle"></h2>
        <p class="desc" data-i18n="pipeDesc"></p>
        <label data-i18n="labelJd"></label>
        <textarea id="jdIn" data-i18n-placeholder="phJd"></textarea>
        <div class="row pipe-actions">
          <label class="inline-label">
            <span data-i18n="labelTheme"></span>
            <select id="themeIn">
              <option value="tech_single" data-i18n="themeTech"></option>
              <option value="ats_clean" data-i18n="themeAts"></option>
              <option value="two_column" data-i18n="themeTwo"></option>
              <option value="impact_first" data-i18n="themeImpact"></option>
            </select>
          </label>
          <button class="primary" id="btnPipeline" data-i18n="btnRun"></button>
          <button class="ghost" id="btnDemo" hidden data-i18n="btnDemo"></button>
          <button class="ghost" id="btnExport" data-i18n="btnExport"></button>
        </div>
        <p class="status" id="pipeStatus"></p>
      </div>

      <div class="panel results-shell">
        <div class="metrics" id="pipeMetrics" hidden>
          <div class="metric"><span class="metric-label" data-i18n="metricScore"></span><strong id="mScore">—</strong></div>
          <div class="metric"><span class="metric-label" data-i18n="metricTheme"></span><strong id="mTheme">—</strong></div>
          <div class="metric"><span class="metric-label" data-i18n="metricBank"></span><strong id="mBank">—</strong></div>
          <div class="metric"><span class="metric-label" data-i18n="metricJob"></span><strong id="mJob">—</strong></div>
        </div>
        <div class="result-tabs" id="resultTabs" hidden>
          <button type="button" class="result-tab active" data-rtab="summary" data-i18n="tabSummary"></button>
          <button type="button" class="result-tab" data-rtab="resume" data-i18n="tabResume"></button>
          <button type="button" class="result-tab" data-rtab="session" data-i18n="tabSession"></button>
          <button type="button" class="result-tab" data-rtab="report" data-i18n="tabReport"></button>
          <a class="btn ghost result-graph" id="pipeGraph" href="/timeline" target="_blank" data-i18n="openGraph"></a>
        </div>
        <div class="result-pane active" id="rtab-summary">
          <p class="idle-hint" id="resultIdle" data-i18n="resultIdle"></p>
          <article class="prose" id="pipeSummary" hidden></article>
        </div>
        <div class="result-pane" id="rtab-resume"><article class="prose" id="pipeResume"></article></div>
        <div class="result-pane" id="rtab-session"><article class="prose" id="pipeSession"></article></div>
        <div class="result-pane" id="rtab-report"><article class="prose" id="pipeReport"></article></div>
      </div>
      <div class="panel" id="graphEmbedPanel" hidden>
        <h2 data-i18n="chipGraph">证据图谱</h2>
        <p class="desc" data-i18n="graphEmbedDesc">流水线完成后可在此筛选、搜索节点。</p>
        <iframe id="graphFrame" title="evidence graph" style="width:100%;min-height:560px;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe>
      </div>
    </section>

    <section class="view" id="view-interview">
      <div class="panel">
        <h2 data-i18n="ivTitle"></h2>
        <p class="desc" data-i18n="ivDesc"></p>
        <div class="row">
          <select id="job" style="max-width:360px"></select>
          <button class="primary" id="btnStart" data-i18n="btnStart"></button>
          <button class="ghost" id="btnSpeak" data-i18n="btnSpeak"></button>
          <button class="ghost" id="btnMic" data-i18n="btnMic"></button>
          <label class="check-label">
            <input type="checkbox" id="useWhisper"/>
            <span data-i18n="asrWhisper">高精度转写</span>
          </label>
          <button class="ghost" id="btnRec" data-i18n="btnRec">录音转写</button>
          <span class="status" id="ivStatus" data-i18n="ivIdle"></span>
        </div>
        <p class="status" id="asrHint" data-i18n="asrHint"></p>
      </div>
      <div class="panel row tab-row">
        <button class="ghost active" data-tab="chat" data-i18n="tabChat"></button>
        <button class="ghost" data-tab="code" data-i18n="tabCode"></button>
      </div>
      <div id="tab-chat">
        <div class="panel chat-shell"><div id="log"></div></div>
        <div class="panel">
          <textarea id="answer" data-i18n-placeholder="phAnswer" style="min-height:100px"></textarea>
          <div class="row" style="margin-top:10px">
            <button class="primary" id="btnSend" data-i18n="btnSend"></button>
          </div>
        </div>
      </div>
      <div id="tab-code" style="display:none">
        <div class="panel">
          <p class="desc" data-i18n="codeHint"></p>
          <div id="editor"></div>
          <div class="row" style="margin-top:10px">
            <button class="primary" id="btnCode" data-i18n="btnCode"></button>
          </div>
          <pre class="status" id="codeFb"></pre>
        </div>
      </div>
    </section>

    <section class="view" id="view-bank">
      <div class="panel">
        <h2 data-i18n="bankTitle"></h2>
        <p class="desc" data-i18n="bankDesc"></p>
        <div class="row">
          <input type="text" id="bankQ" value="LLM Agent RAG" style="flex:1;min-width:200px"/>
          <label class="check-label">
            <input type="checkbox" id="bankSemantic"/>
            <span data-i18n="bankSemantic"></span>
          </label>
          <select id="bankPack">
            <option value="">pack: all</option>
            <option value="cv-llm">cv-llm</option>
            <option value="nlp">nlp</option>
            <option value="mldl">mldl</option>
            <option value="algo">algo</option>
            <option value="bank">bank</option>
            <option value="curated-bigtech">curated-bigtech</option>
          </select>
          <select id="bankDiff">
            <option value="">difficulty: all</option>
            <option value="junior">junior</option>
            <option value="mid">mid</option>
            <option value="senior">senior</option>
          </select>
          <input type="text" id="bankCompany" placeholder="company" style="width:8rem"/>
          <button class="primary" id="btnBank" data-i18n="btnSearch"></button>
        </div>
        <div class="bank-list" id="bankOut"></div>
      </div>
    </section>

    <section class="view" id="view-about">
      <div class="panel">
        <h2 data-i18n="aboutTitle"></h2>
        <article class="prose" id="aboutBox" data-i18n="aboutLoading"></article>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
