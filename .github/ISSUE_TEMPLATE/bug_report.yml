name: Bug report
description: Report a bug in Compass
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请勿粘贴真实简历或含隐私的 `content/` 文件。
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs actual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 0.5.0
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - studio
        - interview-live
        - cli
        - rag
        - docs
        - other
