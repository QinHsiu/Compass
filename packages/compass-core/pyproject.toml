[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-core"
version = "0.7.0"
description = "Evidence-driven job compass: Studio, Live interview, RAG, multi-LLM, evidence graph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "jsonpatch>=1.33",
  "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
studio = [
  "gradio>=4.44",
  "pymupdf>=1.24",
  "edge-tts>=6.1",
  "Pillow>=10.0",
]
live = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
]
rag = ["chromadb>=0.5"]
pdf = ["fpdf2>=2.7"]
asr = ["faster-whisper>=1.0"]
ocr = ["pytesseract>=0.3", "python-docx>=1.1"]

[project.scripts]
compass = "compass_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["compass_core*"]

[tool.setuptools.package-data]
compass_core = [
  "assets/templates/*.json",
  "assets/templates/*.md",
  "assets/questions/*.jsonl",
  "assets/questions/*.json",
  "assets/questions/*.md",
  "assets/life/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
